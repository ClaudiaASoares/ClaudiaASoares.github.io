{% assign icon_base = site.url | append: site.baseurl %}
<link rel="icon" href="{{ icon_base }}/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ icon_base }}/images/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="{{ icon_base }}/images/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="icon" href="{{ icon_base }}/images/favicon-96x96.png" type="image/png" sizes="96x96">
<link rel="icon" href="{{ icon_base }}/images/android-chrome-192x192.png" type="image/png" sizes="192x192">
<link rel="shortcut icon" href="{{ icon_base }}/images/favicon.ico">
<link rel="apple-touch-icon" href="{{ icon_base }}/images/apple-touch-icon-180x180.png" sizes="180x180">
